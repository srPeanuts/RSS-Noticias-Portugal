name: Resumo diario por email
# Quem dispara este workflow é o cron-job.org (todos os dias às 12:02 de Lisboa, com agendado=true).
# O resumo sai uma vez por dia, a partir das 12h (HORA_ENVIO em scripts/enviar_email.py); o envio fica
# registado em dados/email_enviado.txt. "Run workflow" carregado à mão envia sempre (para testar).
on:
  workflow_dispatch:
    inputs:
      agendado:
        description: "Chamada automatica (cron-job.org). Deixa vazio quando corres a mao."
        required: false
        default: ""
        type: string
permissions:
  contents: write
# o mesmo grupo da "Atualizar noticias": as duas nunca correm ao mesmo tempo
concurrency:
  group: atualizar
  cancel-in-progress: false
jobs:
  enviar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.event.repository.default_branch }}
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: E para enviar?
        id: hora
        run: python scripts/enviar_email.py --hora
        env:
          AGENDADO: ${{ inputs.agendado }}

      - uses: astral-sh/setup-uv@v10.2.0
        if: steps.hora.outputs.enviar == 'true'
        with:
          enable-cache: true

      - name: Instalar dependencias (uv, mais rapido que o pip)
        if: steps.hora.outputs.enviar == 'true'
        run: uv pip install --system -r requirements.txt

      - name: Recolher noticias (tenta 2 vezes)
        if: steps.hora.outputs.enviar == 'true'
        run: python scripts/atualizar.py || (echo "A primeira tentativa falhou; nova tentativa daqui a 2 minutos..." && sleep 120 && python scripts/atualizar.py)

      - name: Confirmar que a recolha correu bem
        if: steps.hora.outputs.enviar == 'true'
        run: python scripts/enviar_email.py --verificar

      - name: Guardar resultados
        if: steps.hora.outputs.enviar == 'true'
        run: |
          git config user.name atualizador
          git config user.email atualizador@users.noreply.github.com
          git add dados docs/data
          git diff --cached --quiet || git commit -m "Atualizacao automatica (antes do email)"
          git pull --rebase --autostash
          git push

      - name: Enviar resumo
        if: steps.hora.outputs.enviar == 'true'
        run: python scripts/enviar_email.py
        env:
          EMAIL_UTILIZADOR: ${{ secrets.EMAIL_UTILIZADOR }}
          EMAIL_PASSWORD: ${{ secrets.EMAIL_PASSWORD }}
          EMAIL_PARA: ${{ secrets.EMAIL_PARA }}
          EMAIL_SMTP: ${{ secrets.EMAIL_SMTP }}
          EMAIL_PORTA: ${{ secrets.EMAIL_PORTA }}
          SITE_URL: ${{ vars.SITE_URL }}
          AGENDADO: ${{ inputs.agendado }}

      - name: Registar o envio de hoje
        if: steps.hora.outputs.enviar == 'true'
        run: |
          if [ -f dados/email_enviado.txt ]; then git add dados/email_enviado.txt; fi
          git diff --cached --quiet || git commit -m "Resumo de hoje enviado"
          git pull --rebase --autostash
          git push
